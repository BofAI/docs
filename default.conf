# /etc/nginx/conf.d/default.conf

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Preserve HTTPS at the reverse proxy and avoid reflecting Host in redirects.
    absolute_redirect off;

    # 站点是全静态构建，每个页面都有对应的 index.html；未命中的路径返回真实 404，
    # 并显示对应语言的 Docusaurus 404 页。已迁移的旧地址由 plugin-client-redirects 生成跳转页。
    location /zh-Hans/ {
        try_files $uri $uri/ =404;
        error_page 404 /zh-Hans/404.html;
    }

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
    }

    location /assets/ {
        try_files $uri =404;
    }
}
