name: Release Publish

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: bankofai/docs

jobs:
  checks:
    uses: ./.github/workflows/site-checks.yml
    permissions:
      contents: read

  build-and-publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build image for security checks
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          pull: true
          context: .
          push: false
          load: true
          tags: bankofai/docs:security-check
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
          build-args: |
            APP_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Scan the exact runtime image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: bankofai/docs:security-check
          grype-version: v0.121.3
          fail-build: true
          severity-cutoff: negligible
          only-fixed: false
          output-format: table

      - name: Test production HTTP security headers
        run: |
          docker run --detach --name docs-security-smoke -p 127.0.0.1:8080:80 bankofai/docs:security-check
          node scripts/check-http-security.mjs http://127.0.0.1:8080

      - name: Remove test container
        if: always()
        run: docker rm --force docs-security-smoke || true

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push the scanned image
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker tag bankofai/docs:security-check "$IMAGE_NAME:$RELEASE_VERSION"
          docker push "$IMAGE_NAME:$RELEASE_VERSION"
