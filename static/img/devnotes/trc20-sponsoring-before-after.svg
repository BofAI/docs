<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="622" viewBox="0 0 1120 622" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title">首次 Permit2 支付：授权资源由谁准备？</title><desc id="desc">未启用赞助时，资源不足需要先补充资源。启用赞助后，钱包签名，由支付基础设施准备授权资源并推进付款。</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#355CF6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16865B"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AC5F16"/></marker></defs><rect x="0" y="0" width="1120" height="622" rx="24" fill="#F5F7FC" stroke="#F5F7FC"/><text x="40" y="45" font-size="17" fill="#355CF6" font-weight="600" text-anchor="start">BANK OF AI  /  x402</text><text x="40" y="95" font-size="32" fill="#17213A" font-weight="600" text-anchor="start">首次 Permit2 支付：授权资源由谁准备？</text><text x="40" y="134" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">前提：账户已激活，服务与资产受支持，赞助资源充足。</text><rect x="28" y="175" width="1064" height="168" rx="16" fill="#FFF7EC" stroke="#FFF7EC"/><text x="48" y="211" font-size="23" fill="#AC5F16" font-weight="600" text-anchor="start">未启用资源赞助：资源不足时，需要自己准备</text><rect x="48" y="234" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="162" y="267" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">持有 USDT</text><text x="162" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">准备调用服务</text><path d="M282,275 L305,275" fill="none" stroke="#AC5F16" stroke-width="2.5" marker-end="url(#a)"/><rect x="313" y="234" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="427" y="267" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">补充网络资源</text><text x="427" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">准备 TRX 或能量</text><path d="M547,275 L570,275" fill="none" stroke="#AC5F16" stroke-width="2.5" marker-end="url(#a)"/><rect x="578" y="234" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="692" y="267" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">签署并完成授权</text><text x="692" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">approve 上链</text><path d="M812,275 L835,275" fill="none" stroke="#AC5F16" stroke-width="2.5" marker-end="url(#a)"/><rect x="843" y="234" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="957" y="267" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">付款并取得结果</text><text x="957" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">继续 Agent 任务</text><rect x="28" y="366" width="1064" height="168" rx="16" fill="#EAF6F0" stroke="#EAF6F0"/><text x="48" y="402" font-size="23" fill="#16865B" font-weight="600" text-anchor="start">启用资源赞助：钱包签名，基础设施准备资源</text><rect x="48" y="425" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="162" y="458" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">持有 USDT</text><text x="162" y="488" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">准备调用服务</text><path d="M282,466 L305,466" fill="none" stroke="#16865B" stroke-width="2.5" marker-end="url(#g)"/><rect x="313" y="425" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="427" y="458" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">钱包签名</text><text x="427" y="488" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">授权交易 + 付款凭证</text><path d="M547,466 L570,466" fill="none" stroke="#16865B" stroke-width="2.5" marker-end="url(#g)"/><rect x="578" y="425" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="692" y="458" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">基础设施处理</text><text x="692" y="488" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">提供资源，完成授权</text><path d="M812,466 L835,466" fill="none" stroke="#16865B" stroke-width="2.5" marker-end="url(#g)"/><rect x="843" y="425" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="957" y="458" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">付款并取得结果</text><text x="957" y="488" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">继续 Agent 任务</text><text x="40" y="579" font-size="22" fill="#17213A" font-weight="500" text-anchor="start">变化的是资源准备方式；授权和付款仍由钱包签名确认。</text></svg>