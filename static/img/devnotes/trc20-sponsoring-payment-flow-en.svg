<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1004" viewBox="0 0 1120 1004" role="img" aria-labelledby="title desc" font-family="Inter, Helvetica Neue, Arial, sans-serif"><title id="title">Five steps of a first Permit2 payment</title><desc id="desc">The Agent gets a quote and signs; the server hands the credentials to the Facilitator for verification. The Facilitator provides resources, broadcasts the approval, continues payment once it takes effect, and reclaims resources asynchronously.</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#355CF6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16865B"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AC5F16"/></marker></defs><rect x="0" y="0" width="1120" height="1004" rx="24" fill="#F5F7FC" stroke="#F5F7FC"/><text x="40" y="45" font-size="17" fill="#355CF6" font-weight="600" text-anchor="start">BANK OF AI  /  x402</text><text x="40" y="95" font-size="32" fill="#17213A" font-weight="600" text-anchor="start">Five steps of a first Permit2 payment</text><text x="40" y="135" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">Example: fixed-price exact payment. With enough allowance, sponsoring and approve are skipped.</text><rect x="40" y="172" width="1040" height="124" rx="16" fill="white" stroke="#DCE3EF"/><circle cx="79" cy="214" r="21" fill="#355CF6"/><text x="79" y="221" font-size="19" fill="white" font-weight="600" text-anchor="middle">01</text><text x="114" y="222" font-size="20" fill="#355CF6" font-weight="600" text-anchor="start">Agent ↔ Server</text><text x="419" y="219" font-size="26" fill="#17213A" font-weight="600" text-anchor="start">Get a quote for the service</text><text x="419" y="258" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">The server returns 402 with the price and payment options.</text><path d="M747,301 L747,318" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="323" width="1040" height="124" rx="16" fill="white" stroke="#DCE3EF"/><circle cx="79" cy="365" r="21" fill="#355CF6"/><text x="79" y="372" font-size="19" fill="white" font-weight="600" text-anchor="middle">02</text><text x="114" y="373" font-size="20" fill="#355CF6" font-weight="600" text-anchor="start">Agent wallet</text><text x="419" y="370" font-size="26" fill="#17213A" font-weight="600" text-anchor="start">Sign the approval tx and payment credential</text><text x="419" y="409" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">The wallet signs but does not broadcast approve itself.</text><path d="M747,452 L747,469" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="474" width="1040" height="124" rx="16" fill="white" stroke="#DCE3EF"/><circle cx="79" cy="516" r="21" fill="#355CF6"/><text x="79" y="523" font-size="19" fill="white" font-weight="600" text-anchor="middle">03</text><text x="114" y="524" font-size="20" fill="#355CF6" font-weight="600" text-anchor="start">Server → Facilitator</text><text x="419" y="521" font-size="26" fill="#17213A" font-weight="600" text-anchor="start">Verify, then prepare approval resources</text><text x="419" y="560" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">Temporarily delegates Energy; adds Bandwidth if short.</text><path d="M747,603 L747,620" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="625" width="1040" height="124" rx="16" fill="white" stroke="#DCE3EF"/><circle cx="79" cy="667" r="21" fill="#355CF6"/><text x="79" y="674" font-size="19" fill="white" font-weight="600" text-anchor="middle">04</text><text x="114" y="675" font-size="20" fill="#355CF6" font-weight="600" text-anchor="start">Facilitator → TRON</text><text x="419" y="672" font-size="26" fill="#17213A" font-weight="600" text-anchor="start">Broadcast approve, confirm allowance, then settle</text><text x="419" y="711" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">Broadcasts the wallet-signed approve, then settles the payment.</text><path d="M747,754 L747,771" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="776" width="1040" height="124" rx="16" fill="white" stroke="#DCE3EF"/><circle cx="79" cy="818" r="21" fill="#355CF6"/><text x="79" y="825" font-size="19" fill="white" font-weight="600" text-anchor="middle">05</text><text x="114" y="826" font-size="20" fill="#355CF6" font-weight="600" text-anchor="start">Server → Agent</text><text x="419" y="823" font-size="26" fill="#17213A" font-weight="600" text-anchor="start">Return the result; the Agent continues</text><text x="419" y="862" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">Resource reclaim and recovery are tracked in the background.</text><text x="40" y="964" font-size="22" fill="#17213A" font-weight="500" text-anchor="start">Wallet consents and signs  ·  Facilitator handles resources and on-chain execution</text></svg>