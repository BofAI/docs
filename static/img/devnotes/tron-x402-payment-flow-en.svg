<svg width="1280" height="820" viewBox="0 0 1280 820" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">One Complete BANK OF AI x402 Payment</title><desc id="desc">Six-step sequence: request the resource, receive 402, select a requirement, retry signed, verify and settle, return the resource and payment result.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#334155"/></marker><marker id="red" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#E34A58"/></marker><marker id="green" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#16A34A"/></marker></defs>
  <rect width="1280" height="820" rx="24" fill="#F7F8FC"/><text x="640" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#17213A">One Complete BANK OF AI x402 Payment</text>
  <g><rect x="60" y="106" width="220" height="54" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/><text x="170" y="139" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A8A">AI Agent + Wallet</text><rect x="400" y="106" width="220" height="54" rx="10" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/><text x="510" y="139" text-anchor="middle" font-size="17" font-weight="700" fill="#14532D">Resource Server</text><rect x="740" y="106" width="200" height="54" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/><text x="840" y="139" text-anchor="middle" font-size="17" font-weight="700" fill="#78350F">Facilitator</text><rect x="1040" y="106" width="180" height="54" rx="10" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/><text x="1130" y="139" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0C4A6E">Blockchain Network</text></g>
  <g stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"><line x1="170" y1="160" x2="170" y2="780"/><line x1="510" y1="160" x2="510" y2="780"/><line x1="840" y1="160" x2="840" y2="780"/><line x1="1130" y1="160" x2="1130" y2="780"/></g>
  <line x1="170" y1="218" x2="505" y2="218" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="337" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#17213A">① Request the paid resource</text><text x="337" y="238" text-anchor="middle" font-size="13" fill="#64748B">GET /paid-resource</text>
  <line x1="510" y1="302" x2="175" y2="302" stroke="#E34A58" stroke-width="2.5" marker-end="url(#red)"/><text x="337" y="287" text-anchor="middle" font-size="15" font-weight="700" fill="#C21F30">② Respond 402 Payment Required</text><text x="337" y="322" text-anchor="middle" font-size="13" fill="#64748B">PAYMENT-REQUIRED · accepts[]</text>
  <path d="M170 375h76v42h-66" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#green)"/><text x="264" y="366" font-size="15" font-weight="700" fill="#168048">③ Select a requirement and sign</text><text x="264" y="390" font-size="13" fill="#64748B">Check network, asset, limit, recipient, and validity</text>
  <line x1="170" y1="472" x2="505" y2="472" stroke="#16A34A" stroke-width="2.5" marker-end="url(#green)"/><text x="337" y="457" text-anchor="middle" font-size="15" font-weight="700" fill="#168048">④ Retry with the payment credential</text><text x="337" y="492" text-anchor="middle" font-size="13" fill="#64748B">PAYMENT-SIGNATURE + Payment Payload</text>
  <line x1="510" y1="562" x2="835" y2="562" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="673" y="547" text-anchor="middle" font-size="15" font-weight="700" fill="#17213A">⑤ Verify and settle</text><text x="673" y="582" text-anchor="middle" font-size="13" fill="#64748B">/verify: check requirements against payload</text><line x1="840" y1="614" x2="1125" y2="614" stroke="#7E36B5" stroke-width="2.5" marker-end="url(#a)"/><text x="982" y="604" text-anchor="middle" font-size="13" fill="#5B217F">/settle: submit the on-chain transaction</text><line x1="1125" y1="648" x2="845" y2="648" stroke="#7E36B5" stroke-width="2.5" marker-end="url(#a)"/><text x="985" y="669" text-anchor="middle" font-size="12.5" fill="#64748B">Transaction and settlement result</text>
  <line x1="840" y1="716" x2="515" y2="716" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><line x1="510" y1="752" x2="175" y2="752" stroke="#16A34A" stroke-width="2.5" marker-end="url(#green)"/><text x="337" y="736" text-anchor="middle" font-size="15" font-weight="700" fill="#168048">⑥ Return the resource and payment result</text><text x="337" y="775" text-anchor="middle" font-size="13" fill="#64748B">200 OK · PAYMENT-RESPONSE · transaction id</text>
  <text x="640" y="802" text-anchor="middle" font-size="12.5" fill="#64748B">The server must stay idempotent — keyed on the payment id, authorization nonce, or voucher — so a retry never double-charges or double-delivers.</text>
</svg>
