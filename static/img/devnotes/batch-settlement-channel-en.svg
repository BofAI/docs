<svg width="1280" height="860" viewBox="0 0 1280 860" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <marker id="p1" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#334155"/></marker>
    <marker id="p2" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#16a34a"/></marker>
    <marker id="p3" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#7e22ce"/></marker>
  </defs>
  <rect width="1280" height="860" rx="24" fill="#F7F8FC"/>
  <text x="640" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#17213A">BANK OF AI x402 Batch Settlement: channel + cumulative vouchers</text>
  <rect x="60" y="80" width="220" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="170" y="113" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Client (payer)</text>
  <rect x="430" y="80" width="220" height="52" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="540" y="113" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Resource Server</text>
  <rect x="800" y="80" width="200" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="900" y="113" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Facilitator</text>
  <rect x="1050" y="80" width="180" height="52" rx="10" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/><text x="1140" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#0C4A6E">Settlement Contract</text><text x="1140" y="125" text-anchor="middle" font-size="12" fill="#0369A1">Channel escrow contract</text>
  <line x1="170" y1="132" x2="170" y2="810" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/><line x1="540" y1="132" x2="540" y2="810" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/><line x1="900" y1="132" x2="900" y2="810" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/><line x1="1140" y1="132" x2="1140" y2="810" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="40" y="160" width="1200" height="34" rx="6" fill="#EEF3FF"/><text x="60" y="183" font-size="14.5" font-weight="700" fill="#2F65B8">Phase 1: Open the channel (one-time on-chain tx; Facilitator pays the gas)</text>
  <line x1="170" y1="225" x2="535" y2="225" stroke="#334155" stroke-width="2.5" marker-end="url(#p1)"/><text x="355" y="212" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17213A">deposit payload: ChannelConfig + first voucher + deposit authorization</text>
  <line x1="540" y1="262" x2="895" y2="262" stroke="#334155" stroke-width="2.5" marker-end="url(#p1)"/><text x="718" y="249" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17213A">/verify + /settle(deposit)</text>
  <line x1="900" y1="298" x2="1135" y2="298" stroke="#7E36B5" stroke-width="2.5" marker-end="url(#p3)"/><text x="1018" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#5B217F">Deposited into escrow, channelId =</text><text x="1018" y="318" text-anchor="middle" font-size="12.5" fill="#64748B">Hash(ChannelConfig)</text>
  <rect x="40" y="350" width="1200" height="34" rx="6" fill="#EFFAF3"/><text x="60" y="373" font-size="14.5" font-weight="700" fill="#168048">Phase 2: High-frequency requests (one local signature each — no chain, no gas)</text>
  <line x1="170" y1="415" x2="535" y2="415" stroke="#16A34A" stroke-width="2.5" marker-end="url(#p2)"/><text x="355" y="402" text-anchor="middle" font-size="13.5" font-weight="600" fill="#168048">Voucher: maxClaimableAmount = charged so far + this call's cap (cumulative)</text>
  <rect x="430" y="438" width="370" height="64" rx="10" fill="#FFFFFF" stroke="#86EFAc" stroke-width="2"/><text x="615" y="463" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">Voucher verified locally (no RPC) → run the service</text><text x="615" y="487" text-anchor="middle" font-size="13" fill="#64748B">Actual charge ≤ cap (dynamic pricing), added to chargedCumulativeAmount</text>
  <line x1="540" y1="530" x2="175" y2="530" stroke="#16A34A" stroke-width="2.5" marker-end="url(#p2)"/><text x="355" y="517" text-anchor="middle" font-size="13.5" font-weight="600" fill="#168048">200 OK + chargedAmount + channelState snapshot (client checks each one)</text><text x="355" y="558" text-anchor="middle" font-size="13" fill="#94A3B8">… repeat N times; each new voucher supersedes the last, no nonce needed …</text>
  <rect x="40" y="590" width="1200" height="34" rx="6" fill="#F7F0FF"/><text x="60" y="613" font-size="14.5" font-weight="700" fill="#7E36B5">Phase 3: Batch settlement (server picks the moment: interval / threshold / withdrawal)</text>
  <line x1="540" y1="655" x2="895" y2="655" stroke="#334155" stroke-width="2.5" marker-end="url(#p1)"/><text x="718" y="642" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17213A">/settle(claim): bundle the latest vouchers across channels</text>
  <line x1="900" y1="690" x2="1135" y2="690" stroke="#7E36B5" stroke-width="2.5" marker-end="url(#p3)"/><text x="1018" y="677" text-anchor="middle" font-size="13" font-weight="600" fill="#5B217F">claimWithSignature: records the debt only</text>
  <line x1="540" y1="730" x2="895" y2="730" stroke="#334155" stroke-width="2.5" marker-end="url(#p1)"/><text x="718" y="717" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17213A">/settle(settle): consolidate the recorded funds</text>
  <line x1="900" y1="765" x2="1135" y2="765" stroke="#7E36B5" stroke-width="2.5" marker-end="url(#p3)"/><text x="1018" y="752" text-anchor="middle" font-size="13" font-weight="600" fill="#5B217F">settle: one transfer to the receiver</text>
  <text x="640" y="835" text-anchor="middle" font-size="13.5" fill="#64748B">Exit paths: cooperative refund (instant), or timed withdrawal (initiateWithdraw → wait withdrawDelay, 15 min–30 days → finalizeWithdraw)</text>
</svg>
