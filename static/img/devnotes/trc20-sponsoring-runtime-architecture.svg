<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="898" viewBox="0 0 1120 898" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title">Facilitator 中的授权资源赞助架构</title><desc id="desc">协议实现验证请求后调用 runtime；runtime 通过 verify、sponsor、reconcile 管理赞助，Resource Owner 提供资源并签署资源操作。</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#355CF6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16865B"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AC5F16"/></marker></defs><rect x="0" y="0" width="1120" height="898" rx="24" fill="#F5F7FC" stroke="#F5F7FC"/><text x="40" y="45" font-size="17" fill="#355CF6" font-weight="600" text-anchor="start">BANK OF AI  /  x402</text><text x="40" y="95" font-size="32" fill="#17213A" font-weight="600" text-anchor="start">Facilitator 中的授权资源赞助架构</text><text x="40" y="134" font-size="23" fill="#52627A" font-weight="400" text-anchor="start">协议验证 → 资源赞助 → 支付结算</text><rect x="40" y="176" width="1040" height="88" rx="16" fill="white" stroke="#DCE3EF"/><text x="64" y="212" font-size="25" fill="#17213A" font-weight="600" text-anchor="start">Facilitator 协议实现</text><text x="64" y="245" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">验证 TRC-20 授权交易与付款凭证，调用 runtime；授权就绪后继续结算。</text><path d="M560,270 L560,310" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="325" width="1040" height="290" rx="16" fill="#EAF0FF" stroke="#C9D6FC"/><text x="64" y="373" font-size="28" fill="#355CF6" font-weight="600" text-anchor="start">Resource Sponsoring Runtime</text><rect x="64" y="405" width="304" height="145" rx="16" fill="white" stroke="#DCE3EF"/><text x="84" y="446" font-size="26" fill="#355CF6" font-weight="600" text-anchor="start">verify()</text><text x="84" y="489" font-size="23" fill="#17213A" font-weight="500" text-anchor="start">只读检查</text><text x="84" y="527" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">账户、授权、资源与策略</text><rect x="408" y="405" width="304" height="145" rx="16" fill="white" stroke="#DCE3EF"/><text x="428" y="446" font-size="26" fill="#355CF6" font-weight="600" text-anchor="start">sponsor()</text><text x="428" y="489" font-size="23" fill="#17213A" font-weight="500" text-anchor="start">执行资源赞助</text><text x="428" y="527" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">委托、approve、发起回收</text><rect x="752" y="405" width="304" height="145" rx="16" fill="white" stroke="#DCE3EF"/><text x="772" y="446" font-size="26" fill="#355CF6" font-weight="600" text-anchor="start">reconcile()</text><text x="772" y="489" font-size="23" fill="#17213A" font-weight="500" text-anchor="start">推进未完成操作</text><text x="772" y="527" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">交易查询、撤回与恢复</text><text x="64" y="590" font-size="22" fill="#17213A" font-weight="400" text-anchor="start">可扩展接口：policy / coordinator / chain / resourceOwnerSigner</text><path d="M293,690 L293,622" fill="none" stroke="#16865B" stroke-width="2.5" marker-end="url(#g)"/><text x="312" y="660" font-size="19" fill="#16865B" font-weight="500" text-anchor="start">调用 reconcile()</text><path d="M877,622 L877,690" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><text x="857" y="660" font-size="19" fill="#355CF6" font-weight="500" text-anchor="end">请求资源操作签名</text><rect x="40" y="705" width="510" height="133" rx="16" fill="white" stroke="#DCE3EF"/><text x="64" y="748" font-size="25" fill="#17213A" font-weight="600" text-anchor="start">后台任务</text><text x="64" y="789" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">持续调用恢复入口</text><text x="64" y="820" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">由应用接入自己的调度机制</text><rect x="590" y="705" width="490" height="133" rx="16" fill="white" stroke="#DCE3EF"/><text x="614" y="748" font-size="25" fill="#17213A" font-weight="600" text-anchor="start">Resource Owner · 资源账户</text><text x="614" y="789" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">提供 Stake 2.0 能量与带宽</text><text x="614" y="820" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">签署资源委托与撤回操作</text><text x="40" y="878" font-size="21" fill="#17213A" font-weight="500" text-anchor="start">付款钱包签署代币授权与付款凭证；资源账户签署资源操作。</text></svg>