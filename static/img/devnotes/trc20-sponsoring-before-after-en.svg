<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="622" viewBox="0 0 1120 622" role="img" aria-labelledby="title desc" font-family="Inter, Helvetica Neue, Arial, sans-serif"><title id="title">First Permit2 payment: who covers approval resources?</title><desc id="desc">Without sponsoring, missing resources must be topped up first. With sponsoring, the wallet signs and the payment infrastructure prepares approval resources and moves the payment forward.</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#355CF6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16865B"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AC5F16"/></marker></defs><rect x="0" y="0" width="1120" height="622" rx="24" fill="#F5F7FC" stroke="#F5F7FC"/><text x="40" y="45" font-size="17" fill="#355CF6" font-weight="600" text-anchor="start">BANK OF AI  /  x402</text><text x="40" y="95" font-size="32" fill="#17213A" font-weight="600" text-anchor="start">First Permit2 payment: who covers approval resources?</text><text x="40" y="134" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">Assumes: account activated, service and asset supported, sponsor has enough resources.</text><rect x="28" y="175" width="1064" height="168" rx="16" fill="#FFF7EC" stroke="#FFF7EC"/><text x="48" y="211" font-size="23" fill="#AC5F16" font-weight="600" text-anchor="start">Without sponsoring: you prepare missing resources yourself</text><rect x="48" y="234" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="162" y="267" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">Holds USDT</text><text x="162" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">Ready to call a service</text><path d="M282,275 L305,275" fill="none" stroke="#AC5F16" stroke-width="2.5" marker-end="url(#a)"/><rect x="313" y="234" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="427" y="267" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">Top up resources</text><text x="427" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">Get TRX or Energy</text><path d="M547,275 L570,275" fill="none" stroke="#AC5F16" stroke-width="2.5" marker-end="url(#a)"/><rect x="578" y="234" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="692" y="267" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">Sign and approve</text><text x="692" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">approve on-chain</text><path d="M812,275 L835,275" fill="none" stroke="#AC5F16" stroke-width="2.5" marker-end="url(#a)"/><rect x="843" y="234" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="957" y="267" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">Pay, get result</text><text x="957" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">Agent continues</text><rect x="28" y="366" width="1064" height="168" rx="16" fill="#EAF6F0" stroke="#EAF6F0"/><text x="48" y="402" font-size="23" fill="#16865B" font-weight="600" text-anchor="start">With sponsoring: wallet signs, infrastructure provides resources</text><rect x="48" y="425" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="162" y="458" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">Holds USDT</text><text x="162" y="488" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">Ready to call a service</text><path d="M282,466 L305,466" fill="none" stroke="#16865B" stroke-width="2.5" marker-end="url(#g)"/><rect x="313" y="425" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="427" y="458" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">Wallet signs</text><text x="427" y="488" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">approve tx + credential</text><path d="M547,466 L570,466" fill="none" stroke="#16865B" stroke-width="2.5" marker-end="url(#g)"/><rect x="578" y="425" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="692" y="458" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">Infra handles it</text><text x="692" y="488" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">Resources + approve</text><path d="M812,466 L835,466" fill="none" stroke="#16865B" stroke-width="2.5" marker-end="url(#g)"/><rect x="843" y="425" width="228" height="83" rx="16" fill="white" stroke="#DCE3EF"/><text x="957" y="458" font-size="22" fill="#17213A" font-weight="600" text-anchor="middle">Pay, get result</text><text x="957" y="488" font-size="18" fill="#52627A" font-weight="400" text-anchor="middle">Agent continues</text><text x="40" y="579" font-size="22" fill="#17213A" font-weight="500" text-anchor="start">Only resource preparation changes. The wallet still signs the approval and the payment.</text></svg>