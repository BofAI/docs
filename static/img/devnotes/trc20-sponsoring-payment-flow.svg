<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1004" viewBox="0 0 1120 1004" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title">首次 Permit2 支付的五个步骤</title><desc id="desc">Agent 获取报价并签名，服务端将凭证交给 Facilitator 验证。Facilitator 提供资源、广播授权，授权生效后继续付款，并异步回收资源。</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#355CF6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16865B"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AC5F16"/></marker></defs><rect x="0" y="0" width="1120" height="1004" rx="24" fill="#F5F7FC" stroke="#F5F7FC"/><text x="40" y="45" font-size="17" fill="#355CF6" font-weight="600" text-anchor="start">BANK OF AI  /  x402</text><text x="40" y="95" font-size="32" fill="#17213A" font-weight="600" text-anchor="start">首次 Permit2 支付的五个步骤</text><text x="40" y="135" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">以固定价格 exact 支付为例；已有足够授权时，跳过资源赞助和 approve。</text><rect x="40" y="172" width="1040" height="124" rx="16" fill="white" stroke="#DCE3EF"/><circle cx="79" cy="214" r="21" fill="#355CF6"/><text x="79" y="221" font-size="19" fill="white" font-weight="600" text-anchor="middle">01</text><text x="114" y="222" font-size="20" fill="#355CF6" font-weight="600" text-anchor="start">Agent ↔ 服务端</text><text x="419" y="219" font-size="26" fill="#17213A" font-weight="600" text-anchor="start">获取报价，确认要购买的服务</text><text x="419" y="258" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">服务端返回 402，告知价格与可用的支付方式。</text><path d="M747,301 L747,318" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="323" width="1040" height="124" rx="16" fill="white" stroke="#DCE3EF"/><circle cx="79" cy="365" r="21" fill="#355CF6"/><text x="79" y="372" font-size="19" fill="white" font-weight="600" text-anchor="middle">02</text><text x="114" y="373" font-size="20" fill="#355CF6" font-weight="600" text-anchor="start">Agent 钱包</text><text x="419" y="370" font-size="26" fill="#17213A" font-weight="600" text-anchor="start">签署授权交易和付款凭证</text><text x="419" y="409" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">钱包先签名，暂不自行广播 approve。</text><path d="M747,452 L747,469" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="474" width="1040" height="124" rx="16" fill="white" stroke="#DCE3EF"/><circle cx="79" cy="516" r="21" fill="#355CF6"/><text x="79" y="523" font-size="19" fill="white" font-weight="600" text-anchor="middle">03</text><text x="114" y="524" font-size="20" fill="#355CF6" font-weight="600" text-anchor="start">服务端 → Facilitator</text><text x="419" y="521" font-size="26" fill="#17213A" font-weight="600" text-anchor="start">校验凭证，准备授权所需资源</text><text x="419" y="560" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">临时提供 Energy；Bandwidth 不足时一并补充。</text><path d="M747,603 L747,620" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="625" width="1040" height="124" rx="16" fill="white" stroke="#DCE3EF"/><circle cx="79" cy="667" r="21" fill="#355CF6"/><text x="79" y="674" font-size="19" fill="white" font-weight="600" text-anchor="middle">04</text><text x="114" y="675" font-size="20" fill="#355CF6" font-weight="600" text-anchor="start">Facilitator → TRON</text><text x="419" y="672" font-size="26" fill="#17213A" font-weight="600" text-anchor="start">广播授权，确认生效后继续结算</text><text x="419" y="711" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">广播钱包签署的原始 approve，再执行支付结算。</text><path d="M747,754 L747,771" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="776" width="1040" height="124" rx="16" fill="white" stroke="#DCE3EF"/><circle cx="79" cy="818" r="21" fill="#355CF6"/><text x="79" y="825" font-size="19" fill="white" font-weight="600" text-anchor="middle">05</text><text x="114" y="826" font-size="20" fill="#355CF6" font-weight="600" text-anchor="start">服务端 → Agent</text><text x="419" y="823" font-size="26" fill="#17213A" font-weight="600" text-anchor="start">返回服务结果，Agent 继续任务</text><text x="419" y="862" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">基础设施在后台跟踪资源撤回与恢复。</text><text x="40" y="964" font-size="22" fill="#17213A" font-weight="500" text-anchor="start">钱包负责同意与签名  ·  Facilitator 负责资源与链上执行</text></svg>