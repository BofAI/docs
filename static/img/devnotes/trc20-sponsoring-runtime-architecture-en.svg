<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="898" viewBox="0 0 1120 898" role="img" aria-labelledby="title desc" font-family="Inter, Helvetica Neue, Arial, sans-serif"><title id="title">Approval resource sponsoring inside the Facilitator</title><desc id="desc">The protocol implementation verifies the request and calls the runtime; the runtime manages sponsoring through verify, sponsor and reconcile, and the Resource Owner provides resources and signs resource operations.</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#355CF6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16865B"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AC5F16"/></marker></defs><rect x="0" y="0" width="1120" height="898" rx="24" fill="#F5F7FC" stroke="#F5F7FC"/><text x="40" y="45" font-size="17" fill="#355CF6" font-weight="600" text-anchor="start">BANK OF AI  /  x402</text><text x="40" y="95" font-size="32" fill="#17213A" font-weight="600" text-anchor="start">Approval resource sponsoring inside the Facilitator</text><text x="40" y="134" font-size="23" fill="#52627A" font-weight="400" text-anchor="start">Protocol verification → Resource sponsoring → Settlement</text><rect x="40" y="176" width="1040" height="88" rx="16" fill="white" stroke="#DCE3EF"/><text x="64" y="212" font-size="25" fill="#17213A" font-weight="600" text-anchor="start">Facilitator protocol implementation</text><text x="64" y="245" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">Verifies the approval tx and payment credential, calls the runtime, then settles.</text><path d="M560,270 L560,310" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><rect x="40" y="325" width="1040" height="290" rx="16" fill="#EAF0FF" stroke="#C9D6FC"/><text x="64" y="373" font-size="28" fill="#355CF6" font-weight="600" text-anchor="start">Resource Sponsoring Runtime</text><rect x="64" y="405" width="304" height="145" rx="16" fill="white" stroke="#DCE3EF"/><text x="84" y="446" font-size="26" fill="#355CF6" font-weight="600" text-anchor="start">verify()</text><text x="84" y="489" font-size="23" fill="#17213A" font-weight="500" text-anchor="start">Read-only checks</text><text x="84" y="527" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">Account, allowance, policy</text><rect x="408" y="405" width="304" height="145" rx="16" fill="white" stroke="#DCE3EF"/><text x="428" y="446" font-size="26" fill="#355CF6" font-weight="600" text-anchor="start">sponsor()</text><text x="428" y="489" font-size="23" fill="#17213A" font-weight="500" text-anchor="start">Run sponsoring</text><text x="428" y="527" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">Delegate, approve, reclaim</text><rect x="752" y="405" width="304" height="145" rx="16" fill="white" stroke="#DCE3EF"/><text x="772" y="446" font-size="26" fill="#355CF6" font-weight="600" text-anchor="start">reconcile()</text><text x="772" y="489" font-size="23" fill="#17213A" font-weight="500" text-anchor="start">Finish pending work</text><text x="772" y="527" font-size="20" fill="#52627A" font-weight="400" text-anchor="start">Lookup, reclaim, recover</text><text x="64" y="590" font-size="22" fill="#17213A" font-weight="400" text-anchor="start">Pluggable: policy / coordinator / chain / resourceOwnerSigner</text><path d="M293,690 L293,622" fill="none" stroke="#16865B" stroke-width="2.5" marker-end="url(#g)"/><text x="312" y="660" font-size="19" fill="#16865B" font-weight="500" text-anchor="start">calls reconcile()</text><path d="M877,622 L877,690" fill="none" stroke="#355CF6" stroke-width="2.5" marker-end="url(#b)"/><text x="857" y="660" font-size="19" fill="#355CF6" font-weight="500" text-anchor="end">requests resource signatures</text><rect x="40" y="705" width="510" height="133" rx="16" fill="white" stroke="#DCE3EF"/><text x="64" y="748" font-size="25" fill="#17213A" font-weight="600" text-anchor="start">Background job</text><text x="64" y="789" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">Keeps calling the recovery entry</text><text x="64" y="820" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">Scheduled by your application</text><rect x="590" y="705" width="490" height="133" rx="16" fill="white" stroke="#DCE3EF"/><text x="614" y="748" font-size="25" fill="#17213A" font-weight="600" text-anchor="start">Resource Owner</text><text x="614" y="789" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">Provides Stake 2.0 Energy and Bandwidth</text><text x="614" y="820" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">Signs delegate and undelegate operations</text><text x="40" y="878" font-size="21" fill="#17213A" font-weight="500" text-anchor="start">The payer wallet signs approval and payment; the resource account signs resource ops.</text></svg>