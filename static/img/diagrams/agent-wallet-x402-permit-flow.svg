<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 635" width="880" height="635" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',monospace" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="ah-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="ah-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="880" height="635" rx="14" fill="#020617"/>
  <rect width="880" height="635" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="634" rx="14" fill="none" stroke="#1e293b"/>
  <circle cx="28" cy="33" r="6" fill="#a78bfa"/>
  <text x="46" y="39" fill="#f8fafc" font-size="17" font-weight="700">x402 PaymentPermit signing</text>
  <text x="46" y="60" fill="#94a3b8" font-size="11">Sign first, verify to proceed — the agent never waits for on-chain confirmation.</text>
  <rect x="170" y="88" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="88" width="540" height="55" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="440.0" y="113" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Server returns 402</text>
  <text x="440.0" y="132" fill="#94a3b8" font-size="10" text-anchor="middle">Payment parameters come back with the 402 response</text>
  <circle cx="150" cy="108" r="13" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="112" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="724" y="112" fill="#a78bfa" font-size="10" font-weight="600">SERVER</text>
  <line x1="440.0" y1="143" x2="440.0" y2="179" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <rect x="170" y="183" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="183" width="540" height="55" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="440.0" y="208" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Agent builds PaymentPermit</text>
  <text x="440.0" y="227" fill="#94a3b8" font-size="10" text-anchor="middle">TransferWithAuthorization struct, EIP-712 format</text>
  <circle cx="150" cy="203" r="13" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="207" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="724" y="207" fill="#a78bfa" font-size="10" font-weight="600">x402 SDK</text>
  <line x1="440.0" y1="238" x2="440.0" y2="274" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <rect x="170" y="278" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="278" width="540" height="55" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="440.0" y="303" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Agent-wallet signs</text>
  <text x="440.0" y="322" fill="#94a3b8" font-size="10" text-anchor="middle">The only step Agent-wallet is responsible for</text>
  <circle cx="150" cy="298" r="13" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="150" y="302" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="724" y="302" fill="#fb7185" font-size="10" font-weight="600">LOCAL</text>
  <line x1="440.0" y1="333" x2="440.0" y2="369" stroke="#fb7185" stroke-width="1.5" marker-end="url(#ah-rose)"/>
  <rect x="170" y="373" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="373" width="540" height="55" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="440.0" y="398" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Resend request with signature</text>
  <text x="440.0" y="417" fill="#94a3b8" font-size="10" text-anchor="middle">The signature travels as the payment credential</text>
  <circle cx="150" cy="393" r="13" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="150" y="397" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="724" y="397" fill="#34d399" font-size="10" font-weight="600">AGENT</text>
  <line x1="440.0" y1="428" x2="440.0" y2="464" stroke="#34d399" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
  <rect x="170" y="468" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="468" width="540" height="55" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="440.0" y="493" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Server verifies and responds</text>
  <text x="440.0" y="512" fill="#94a3b8" font-size="10" text-anchor="middle">Content returned only if the signature checks out</text>
  <circle cx="150" cy="488" r="13" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="492" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <text x="724" y="492" fill="#a78bfa" font-size="10" font-weight="600">SERVER</text>
  <rect x="48" y="597" width="18" height="11" rx="3" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="74" y="607" fill="#94a3b8" font-size="10">User / manual step</text>
  <rect x="298" y="597" width="18" height="11" rx="3" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="324" y="607" fill="#94a3b8" font-size="10">AI / automated step</text>
  <rect x="548" y="597" width="18" height="11" rx="3" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="574" y="607" fill="#94a3b8" font-size="10">Local signing (private key)</text>
</svg>
