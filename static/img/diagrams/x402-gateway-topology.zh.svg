<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',monospace" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="ah-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="ah-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="880" height="390" rx="14" fill="#020617"/>
  <rect width="880" height="390" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="389" rx="14" fill="none" stroke="#1e293b"/>
  <circle cx="28" cy="33" r="6" fill="#a78bfa"/>
  <text x="46" y="39" fill="#f8fafc" font-size="17" font-weight="700">Gateway —— 挡在你 API 前面的收银台兼中继</text>
  <text x="46" y="60" fill="#94a3b8" font-size="11">本质是一层反向代理。Agent 只访问网关地址，你的上游 API 保持原样。</text>
  <rect x="50" y="106" width="206" height="74" rx="8" fill="#0f172a"/>
  <rect x="50" y="106" width="206" height="74" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="153.0" y="131" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Agent</text>
  <text x="153.0" y="150" fill="#94a3b8" font-size="10" text-anchor="middle">用自己的钱包</text>
  <text x="153.0" y="165" fill="#94a3b8" font-size="10" text-anchor="middle">在链上付款</text>
  <line x1="264" y1="143" x2="328" y2="143" stroke="#34d399" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
  <text x="296.0" y="134" fill="#94a3b8" font-size="10" text-anchor="middle">请求</text>
  <rect x="336" y="106" width="206" height="74" rx="8" fill="#0f172a"/>
  <rect x="336" y="106" width="206" height="74" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="439.0" y="131" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Gateway</text>
  <text x="439.0" y="150" fill="#94a3b8" font-size="10" text-anchor="middle">报价 / 校验 / 结算</text>
  <text x="439.0" y="165" fill="#94a3b8" font-size="10" text-anchor="middle">（仅付费端点）</text>
  <line x1="550" y1="143" x2="614" y2="143" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <text x="582.0" y="134" fill="#94a3b8" font-size="10" text-anchor="middle">转发</text>
  <rect x="622" y="106" width="206" height="74" rx="8" fill="#0f172a"/>
  <rect x="622" y="106" width="206" height="74" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="725.0" y="131" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">你的上游 API</text>
  <text x="725.0" y="150" fill="#94a3b8" font-size="10" text-anchor="middle">完全不改</text>
  <text x="725.0" y="165" fill="#94a3b8" font-size="10" text-anchor="middle">一行代码</text>
  <rect x="50" y="220" width="780" height="42" rx="8" fill="rgba(30, 41, 59, 0.35)" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="66" y="238" fill="#e2e8f0" font-size="11" font-weight="700">永远不碰私钥</text>
  <text x="66" y="254" fill="#94a3b8" font-size="10">结算只用钱包地址，网关两侧都不接触私钥。</text>
  <rect x="50" y="272" width="780" height="42" rx="8" fill="rgba(30, 41, 59, 0.35)" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="66" y="290" fill="#e2e8f0" font-size="11" font-weight="700">上游密钥隔离</text>
  <text x="66" y="306" fill="#94a3b8" font-size="10">API Key 只存在网关一侧 —— 自建则在本地 YAML/env，官方网关则由我们保管，调用方永远看不到。</text>
  <rect x="50" y="324" width="780" height="42" rx="8" fill="rgba(30, 41, 59, 0.35)" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="66" y="342" fill="#e2e8f0" font-size="11" font-weight="700">价格按端点自定</text>
  <text x="66" y="358" fill="#94a3b8" font-size="10">标价的端点走 402 流程；未标价（价格为 0）的端点直接转发。</text>
</svg>
