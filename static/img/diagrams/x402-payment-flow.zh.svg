<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 866" width="880" height="866" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',monospace" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="ah-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="ah-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="880" height="866" rx="14" fill="#020617"/>
  <rect width="880" height="866" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="865" rx="14" fill="none" stroke="#1e293b"/>
  <circle cx="28" cy="33" r="6" fill="#a78bfa"/>
  <text x="46" y="39" fill="#f8fafc" font-size="17" font-weight="700">x402 支付流程</text>
  <text x="46" y="60" fill="#94a3b8" font-size="11">客户端、服务端与 Facilitator 如何结算一次付费 HTTP 请求</text>
  <rect x="351.0" y="88" width="178" height="38" rx="19.0" fill="#0f172a"/>
  <rect x="351.0" y="88" width="178" height="38" rx="19.0" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
  <text x="440.0" y="111.0" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">客户端请求付费资源</text>
  <line x1="440.0" y1="126" x2="440.0" y2="162" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ah-cyan)"/>
  <rect x="170" y="166" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="166" width="540" height="55" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="440.0" y="191" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">客户端发起请求</text>
  <text x="440.0" y="210" fill="#94a3b8" font-size="10" text-anchor="middle">普通 HTTP 请求，尚未携带支付凭证</text>
  <circle cx="150" cy="186" r="13" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="150" y="190" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="724" y="190" fill="#34d399" font-size="10" font-weight="600">客户端</text>
  <line x1="440.0" y1="221" x2="440.0" y2="257" stroke="#34d399" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
  <text x="560" y="243.0" fill="#94a3b8" font-size="10">402</text>
  <rect x="170" y="261" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="261" width="540" height="55" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="440.0" y="286" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">服务端要求付款</text>
  <text x="440.0" y="305" fill="#94a3b8" font-size="10" text-anchor="middle">返回 402 · 支付详情放在 PAYMENT-REQUIRED（Base64）</text>
  <circle cx="150" cy="281" r="13" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="285" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="724" y="285" fill="#a78bfa" font-size="10" font-weight="600">服务端</text>
  <line x1="440.0" y1="316" x2="440.0" y2="352" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <text x="560" y="338.0" fill="#94a3b8" font-size="10">签名</text>
  <rect x="170" y="356" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="356" width="540" height="55" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="440.0" y="381" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">客户端提交支付</text>
  <text x="440.0" y="400" fill="#94a3b8" font-size="10" text-anchor="middle">生成签名，通过 PAYMENT-SIGNATURE 重发请求</text>
  <circle cx="150" cy="376" r="13" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="150" y="380" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="724" y="380" fill="#fb7185" font-size="10" font-weight="600">客户端</text>
  <line x1="440.0" y1="411" x2="440.0" y2="447" stroke="#fb7185" stroke-width="1.5" marker-end="url(#ah-rose)"/>
  <text x="560" y="433.0" fill="#94a3b8" font-size="10">/verify</text>
  <rect x="170" y="451" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="451" width="540" height="55" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="440.0" y="476" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">服务端校验支付</text>
  <text x="440.0" y="495" fill="#94a3b8" font-size="10" text-anchor="middle">调用 Facilitator /verify 校验签名与载荷完整性</text>
  <circle cx="150" cy="471" r="13" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="150" y="475" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="724" y="475" fill="#fbbf24" font-size="10" font-weight="600">FACILITATOR</text>
  <line x1="440.0" y1="506" x2="440.0" y2="542" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <text x="560" y="528.0" fill="#94a3b8" font-size="10">/settle</text>
  <rect x="170" y="546" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="546" width="540" height="55" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="440.0" y="571" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">服务端执行结算</text>
  <text x="440.0" y="590" fill="#94a3b8" font-size="10" text-anchor="middle">调用 Facilitator /settle，交易提交上链</text>
  <circle cx="150" cy="566" r="13" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="150" y="570" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <text x="724" y="570" fill="#fbbf24" font-size="10" font-weight="600">FACILITATOR</text>
  <line x1="440.0" y1="601" x2="440.0" y2="637" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <rect x="170" y="641" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="641" width="540" height="55" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="440.0" y="666" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">服务端交付资源</text>
  <text x="440.0" y="685" fill="#94a3b8" font-size="10" text-anchor="middle">响应在 PAYMENT-RESPONSE 中带回交易哈希</text>
  <circle cx="150" cy="661" r="13" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="665" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">6</text>
  <text x="724" y="665" fill="#a78bfa" font-size="10" font-weight="600">服务端</text>
  <line x1="440.0" y1="696" x2="440.0" y2="732" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <rect x="365.0" y="736" width="150" height="38" rx="19.0" fill="#0f172a"/>
  <rect x="365.0" y="736" width="150" height="38" rx="19.0" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
  <text x="440.0" y="759.0" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">资源交付完成</text>
  <rect x="48" y="808" width="18" height="11" rx="3" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="74" y="818" fill="#94a3b8" font-size="10">用户 / 手动步骤</text>
  <rect x="298" y="808" width="18" height="11" rx="3" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="324" y="818" fill="#94a3b8" font-size="10">AI / 自动步骤</text>
  <rect x="548" y="808" width="18" height="11" rx="3" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="574" y="818" fill="#94a3b8" font-size="10">网络 / 外部接口</text>
  <rect x="48" y="828" width="18" height="11" rx="3" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="74" y="838" fill="#94a3b8" font-size="10">本地签名（私钥）</text>
  <rect x="298" y="828" width="18" height="11" rx="3" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="324" y="838" fill="#94a3b8" font-size="10">起点 / 终点</text>
</svg>
