<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 635" width="880" height="635" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',monospace" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eef2f7" stroke-width="0.5"/>
    </pattern>
    <marker id="ah-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="ah-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
  </defs>
  <rect width="880" height="635" rx="14" fill="#ffffff"/>
  <rect width="880" height="635" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="634" rx="14" fill="none" stroke="#e2e8f0"/>
  <circle cx="28" cy="33" r="6" fill="#7c3aed"/>
  <text x="46" y="39" fill="#0f172a" font-size="17" font-weight="700">x402 PaymentPermit signing</text>
  <text x="46" y="60" fill="#64748b" font-size="11">Sign first, verify to proceed — the agent never waits for on-chain confirmation.</text>
  <rect x="170" y="88" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="88" width="540" height="55" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440.0" y="113" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Server returns 402</text>
  <text x="440.0" y="132" fill="#64748b" font-size="10" text-anchor="middle">Payment parameters come back with the 402 response</text>
  <circle cx="150" cy="108" r="13" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="112" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="724" y="112" fill="#7c3aed" font-size="10" font-weight="600">SERVER</text>
  <line x1="440.0" y1="143" x2="440.0" y2="179" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <rect x="170" y="183" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="183" width="540" height="55" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440.0" y="208" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Agent builds PaymentPermit</text>
  <text x="440.0" y="227" fill="#64748b" font-size="10" text-anchor="middle">TransferWithAuthorization struct, EIP-712 format</text>
  <circle cx="150" cy="203" r="13" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="207" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="724" y="207" fill="#7c3aed" font-size="10" font-weight="600">x402 SDK</text>
  <line x1="440.0" y1="238" x2="440.0" y2="274" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <rect x="170" y="278" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="278" width="540" height="55" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="440.0" y="303" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Agent-wallet signs</text>
  <text x="440.0" y="322" fill="#64748b" font-size="10" text-anchor="middle">The only step Agent-wallet is responsible for</text>
  <circle cx="150" cy="298" r="13" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
  <text x="150" y="302" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="724" y="302" fill="#e11d48" font-size="10" font-weight="600">LOCAL</text>
  <line x1="440.0" y1="333" x2="440.0" y2="369" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ah-rose)"/>
  <rect x="170" y="373" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="373" width="540" height="55" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440.0" y="398" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Resend request with signature</text>
  <text x="440.0" y="417" fill="#64748b" font-size="10" text-anchor="middle">The signature travels as the payment credential</text>
  <circle cx="150" cy="393" r="13" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="150" y="397" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="724" y="397" fill="#059669" font-size="10" font-weight="600">AGENT</text>
  <line x1="440.0" y1="428" x2="440.0" y2="464" stroke="#059669" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
  <rect x="170" y="468" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="468" width="540" height="55" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440.0" y="493" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Server verifies and responds</text>
  <text x="440.0" y="512" fill="#64748b" font-size="10" text-anchor="middle">Content returned only if the signature checks out</text>
  <circle cx="150" cy="488" r="13" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="492" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <text x="724" y="492" fill="#7c3aed" font-size="10" font-weight="600">SERVER</text>
  <rect x="48" y="597" width="18" height="11" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="74" y="607" fill="#64748b" font-size="10">User / manual step</text>
  <rect x="298" y="597" width="18" height="11" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="324" y="607" fill="#64748b" font-size="10">AI / automated step</text>
  <rect x="548" y="597" width="18" height="11" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="574" y="607" fill="#64748b" font-size="10">Local signing (private key)</text>
</svg>
