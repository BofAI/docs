<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 445" width="880" height="445" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',monospace" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="ah-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="ah-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="880" height="445" rx="14" fill="#020617"/>
  <rect width="880" height="445" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="444" rx="14" fill="none" stroke="#1e293b"/>
  <circle cx="28" cy="33" r="6" fill="#a78bfa"/>
  <text x="46" y="39" fill="#f8fafc" font-size="17" font-weight="700">TRON 转账 —— Agent-wallet 在哪一步</text>
  <text x="46" y="60" fill="#94a3b8" font-size="11">Agent-wallet 只负责签名，不需要 RPC 连接，也不感知交易的业务含义。</text>
  <rect x="170" y="88" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="88" width="540" height="55" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="440.0" y="113" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">TronGrid — 构造</text>
  <text x="440.0" y="132" fill="#94a3b8" font-size="10" text-anchor="middle">createtransaction 返回未签名交易（txID + raw_data）</text>
  <circle cx="150" cy="108" r="13" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="150" y="112" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="724" y="112" fill="#fbbf24" font-size="10" font-weight="600">网络</text>
  <line x1="440.0" y1="143" x2="440.0" y2="179" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <text x="560" y="165.0" fill="#94a3b8" font-size="10">未签名交易</text>
  <rect x="170" y="183" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="183" width="540" height="55" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="440.0" y="208" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Agent-wallet — 签名</text>
  <text x="440.0" y="227" fill="#94a3b8" font-size="10" text-anchor="middle">完全离线，私钥不出本机</text>
  <circle cx="150" cy="203" r="13" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="150" y="207" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="724" y="207" fill="#fb7185" font-size="10" font-weight="600">本地</text>
  <line x1="440.0" y1="238" x2="440.0" y2="274" stroke="#fb7185" stroke-width="1.5" marker-end="url(#ah-rose)"/>
  <text x="560" y="260.0" fill="#94a3b8" font-size="10">已签名交易</text>
  <rect x="170" y="278" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="278" width="540" height="55" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="440.0" y="303" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">TronGrid — 广播</text>
  <text x="440.0" y="322" fill="#94a3b8" font-size="10" text-anchor="middle">broadcasttransaction 发布上链</text>
  <circle cx="150" cy="298" r="13" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="150" y="302" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="724" y="302" fill="#fbbf24" font-size="10" font-weight="600">网络</text>
  <rect x="48" y="407" width="18" height="11" rx="3" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="74" y="417" fill="#94a3b8" font-size="10">网络 / 外部接口</text>
  <rect x="298" y="407" width="18" height="11" rx="3" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="324" y="417" fill="#94a3b8" font-size="10">本地签名（私钥）</text>
</svg>
