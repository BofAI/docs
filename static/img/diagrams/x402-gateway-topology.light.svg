<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',monospace" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eef2f7" stroke-width="0.5"/>
    </pattern>
    <marker id="ah-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="ah-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
  </defs>
  <rect width="880" height="390" rx="14" fill="#ffffff"/>
  <rect width="880" height="390" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="389" rx="14" fill="none" stroke="#e2e8f0"/>
  <circle cx="28" cy="33" r="6" fill="#7c3aed"/>
  <text x="46" y="39" fill="#0f172a" font-size="17" font-weight="700">Gateway — a cashier and relay in front of your API</text>
  <text x="46" y="60" fill="#64748b" font-size="11">Technically a reverse proxy. Agents only ever hit the gateway address; your upstream API stays exactly as it is.</text>
  <rect x="50" y="106" width="206" height="74" rx="8" fill="#ffffff"/>
  <rect x="50" y="106" width="206" height="74" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="153.0" y="131" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Agent</text>
  <text x="153.0" y="150" fill="#64748b" font-size="10" text-anchor="middle">pays on-chain from</text>
  <text x="153.0" y="165" fill="#64748b" font-size="10" text-anchor="middle">its own wallet</text>
  <line x1="264" y1="143" x2="328" y2="143" stroke="#059669" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
  <text x="296.0" y="134" fill="#64748b" font-size="10" text-anchor="middle">request</text>
  <rect x="336" y="106" width="206" height="74" rx="8" fill="#ffffff"/>
  <rect x="336" y="106" width="206" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="439.0" y="131" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Gateway</text>
  <text x="439.0" y="150" fill="#64748b" font-size="10" text-anchor="middle">quote / verify / settle</text>
  <text x="439.0" y="165" fill="#64748b" font-size="10" text-anchor="middle">(paid endpoints only)</text>
  <line x1="550" y1="143" x2="614" y2="143" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <text x="582.0" y="134" fill="#64748b" font-size="10" text-anchor="middle">forwards</text>
  <rect x="622" y="106" width="206" height="74" rx="8" fill="#ffffff"/>
  <rect x="622" y="106" width="206" height="74" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="725.0" y="131" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Your upstream API</text>
  <text x="725.0" y="150" fill="#64748b" font-size="10" text-anchor="middle">unchanged — not one</text>
  <text x="725.0" y="165" fill="#64748b" font-size="10" text-anchor="middle">line of code</text>
  <rect x="50" y="220" width="780" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="66" y="238" fill="#1e293b" font-size="11" font-weight="700">Never a private key</text>
  <text x="66" y="254" fill="#64748b" font-size="10">Settlement uses a wallet address only. Neither side of the gateway ever touches a private key.</text>
  <rect x="50" y="272" width="780" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="66" y="290" fill="#1e293b" font-size="11" font-weight="700">Upstream keys stay isolated</text>
  <text x="66" y="306" fill="#64748b" font-size="10">Your API key lives only gateway-side — local YAML/env if self-hosted, held by us if official. Callers never see it.</text>
  <rect x="50" y="324" width="780" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="66" y="342" fill="#1e293b" font-size="11" font-weight="700">You price each endpoint</text>
  <text x="66" y="358" fill="#64748b" font-size="10">Priced endpoints take the 402 flow; unpriced (price 0) endpoints are forwarded straight through.</text>
</svg>
