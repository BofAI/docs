<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',monospace" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eef2f7" stroke-width="0.5"/>
    </pattern>
    <marker id="ah-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="ah-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
  </defs>
  <rect width="880" height="372" rx="14" fill="#ffffff"/>
  <rect width="880" height="372" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="371" rx="14" fill="none" stroke="#e2e8f0"/>
  <circle cx="28" cy="33" r="6" fill="#7c3aed"/>
  <text x="46" y="39" fill="#0f172a" font-size="17" font-weight="700">API Catalog —— 从一个 PR 到三个消费端</text>
  <text x="46" y="60" fill="#64748b" font-size="11">目录本身不存数据库、不接收上游密钥：只负责让服务可被发现，不碰调用也不碰资金。</text>
  <text x="40" y="88" fill="#059669" font-size="10" font-weight="700">服务提供方</text>
  <rect x="40" y="100" width="225" height="94" rx="8" fill="#ffffff"/>
  <rect x="40" y="100" width="225" height="94" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="56" y="128" fill="#1e293b" font-size="10">catalog.json</text>
  <text x="56" y="144" fill="#1e293b" font-size="10">pay.md</text>
  <text x="56" y="160" fill="#1e293b" font-size="10">（两个公开文件）</text>
  <line x1="271" y1="147.0" x2="321" y2="147.0" stroke="#059669" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
  <text x="296.0" y="138.0" fill="#64748b" font-size="10" text-anchor="middle">提交 PR</text>
  <text x="327" y="88" fill="#7c3aed" font-size="10" font-weight="700">目录仓库（CI）</text>
  <rect x="327" y="100" width="225" height="78" rx="8" fill="#ffffff"/>
  <rect x="327" y="100" width="225" height="78" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="343" y="128" fill="#1e293b" font-size="10">字段与敏感信息扫描</text>
  <text x="343" y="144" fill="#1e293b" font-size="10">构建静态快照 dist/</text>
  <line x1="558" y1="139.0" x2="608" y2="139.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <text x="583.0" y="130.0" fill="#64748b" font-size="10" text-anchor="middle">校验发布</text>
  <text x="614" y="88" fill="#d97706" font-size="10" font-weight="700">分发</text>
  <rect x="614" y="100" width="225" height="94" rx="8" fill="#ffffff"/>
  <rect x="614" y="100" width="225" height="94" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="630" y="128" fill="#1e293b" font-size="10">/api/catalog.json</text>
  <text x="630" y="144" fill="#1e293b" font-size="10">/api/providers/&lt;fqn&gt;.json</text>
  <text x="630" y="160" fill="#1e293b" font-size="10">/api/pay/&lt;fqn&gt;.json · .md</text>
  <line x1="726.5" y1="198" x2="726.5" y2="236" stroke="#d97706" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <text x="714.5" y="218" fill="#64748b" font-size="10" text-anchor="end">同一份数据，三种接入方式</text>
  <line x1="152.5" y1="240" x2="726.5" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="152.5" y1="240" x2="152.5" y2="280" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah-slate)"/>
  <rect x="40" y="284" width="225" height="58" rx="8" fill="#ffffff"/>
  <rect x="40" y="284" width="225" height="58" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="152.5" y="309" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">目录网站</text>
  <text x="152.5" y="328" fill="#64748b" font-size="10" text-anchor="middle">供人浏览与比较</text>
  <line x1="439.5" y1="240" x2="439.5" y2="280" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah-slate)"/>
  <rect x="327" y="284" width="225" height="58" rx="8" fill="#ffffff"/>
  <rect x="327" y="284" width="225" height="58" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="439.5" y="309" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">x402-cli</text>
  <text x="439.5" y="328" fill="#64748b" font-size="10" text-anchor="middle">搜索、查看、付费调用</text>
  <line x1="726.5" y1="240" x2="726.5" y2="280" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah-slate)"/>
  <rect x="614" y="284" width="225" height="58" rx="8" fill="#ffffff"/>
  <rect x="614" y="284" width="225" height="58" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="726.5" y="309" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">MCP</text>
  <text x="726.5" y="328" fill="#64748b" font-size="10" text-anchor="middle">Agent 按名字直接调用</text>
</svg>
