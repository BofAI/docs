<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 445" width="880" height="445" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',monospace" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eef2f7" stroke-width="0.5"/>
    </pattern>
    <marker id="ah-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="ah-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
  </defs>
  <rect width="880" height="445" rx="14" fill="#ffffff"/>
  <rect width="880" height="445" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="444" rx="14" fill="none" stroke="#e2e8f0"/>
  <circle cx="28" cy="33" r="6" fill="#7c3aed"/>
  <text x="46" y="39" fill="#0f172a" font-size="17" font-weight="700">EVM 转账 —— Agent-wallet 在哪一步</text>
  <text x="46" y="60" fill="#64748b" font-size="11">BSC / Ethereum / Polygon / Base —— 只需替换 RPC_URL 与 CHAIN_ID。</text>
  <rect x="170" y="88" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="88" width="540" height="55" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440.0" y="113" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">RPC — 构造</text>
  <text x="440.0" y="132" fill="#64748b" font-size="10" text-anchor="middle">查询 nonce / gas / chainId，自行组装交易对象</text>
  <circle cx="150" cy="108" r="13" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="112" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="724" y="112" fill="#d97706" font-size="10" font-weight="600">网络</text>
  <line x1="440.0" y1="143" x2="440.0" y2="179" stroke="#d97706" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <text x="560" y="165.0" fill="#64748b" font-size="10">未签名交易</text>
  <rect x="170" y="183" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="183" width="540" height="55" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="440.0" y="208" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Agent-wallet — 签名</text>
  <text x="440.0" y="227" fill="#64748b" font-size="10" text-anchor="middle">返回 hex 编码的已签名交易</text>
  <circle cx="150" cy="203" r="13" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
  <text x="150" y="207" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="724" y="207" fill="#e11d48" font-size="10" font-weight="600">本地</text>
  <line x1="440.0" y1="238" x2="440.0" y2="274" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ah-rose)"/>
  <text x="560" y="260.0" fill="#64748b" font-size="10">已签名交易</text>
  <rect x="170" y="278" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="278" width="540" height="55" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440.0" y="303" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">RPC — sendRawTransaction</text>
  <text x="440.0" y="322" fill="#64748b" font-size="10" text-anchor="middle">将已签名交易广播到网络</text>
  <circle cx="150" cy="298" r="13" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="302" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="724" y="302" fill="#d97706" font-size="10" font-weight="600">网络</text>
  <rect x="48" y="407" width="18" height="11" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="74" y="417" fill="#64748b" font-size="10">网络 / 外部接口</text>
  <rect x="298" y="407" width="18" height="11" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="324" y="417" fill="#64748b" font-size="10">本地签名（私钥）</text>
</svg>
