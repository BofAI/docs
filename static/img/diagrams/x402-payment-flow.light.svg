<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 866" width="880" height="866" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',monospace" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eef2f7" stroke-width="0.5"/>
    </pattern>
    <marker id="ah-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="ah-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
  </defs>
  <rect width="880" height="866" rx="14" fill="#ffffff"/>
  <rect width="880" height="866" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="865" rx="14" fill="none" stroke="#e2e8f0"/>
  <circle cx="28" cy="33" r="6" fill="#7c3aed"/>
  <text x="46" y="39" fill="#0f172a" font-size="17" font-weight="700">x402 payment flow</text>
  <text x="46" y="60" fill="#64748b" font-size="11">How a client, a server and the Facilitator settle one paid HTTP request</text>
  <rect x="315.0" y="88" width="250" height="38" rx="19.0" fill="#ffffff"/>
  <rect x="315.0" y="88" width="250" height="38" rx="19.0" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="440.0" y="111.0" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Client wants a paid resource</text>
  <line x1="440.0" y1="126" x2="440.0" y2="162" stroke="#0891b2" stroke-width="1.5" marker-end="url(#ah-cyan)"/>
  <rect x="170" y="166" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="166" width="540" height="55" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440.0" y="191" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Client initiates request</text>
  <text x="440.0" y="210" fill="#64748b" font-size="10" text-anchor="middle">Plain HTTP request, no payment attached yet</text>
  <circle cx="150" cy="186" r="13" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="150" y="190" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="724" y="190" fill="#059669" font-size="10" font-weight="600">CLIENT</text>
  <line x1="440.0" y1="221" x2="440.0" y2="257" stroke="#059669" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
  <text x="560" y="243.0" fill="#64748b" font-size="10">402</text>
  <rect x="170" y="261" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="261" width="540" height="55" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440.0" y="286" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Server requires payment</text>
  <text x="440.0" y="305" fill="#64748b" font-size="10" text-anchor="middle">402 Payment Required · details in PAYMENT-REQUIRED (Base64)</text>
  <circle cx="150" cy="281" r="13" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="285" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="724" y="285" fill="#7c3aed" font-size="10" font-weight="600">SERVER</text>
  <line x1="440.0" y1="316" x2="440.0" y2="352" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <text x="560" y="338.0" fill="#64748b" font-size="10">sign</text>
  <rect x="170" y="356" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="356" width="540" height="55" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="440.0" y="381" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Client submits payment</text>
  <text x="440.0" y="400" fill="#64748b" font-size="10" text-anchor="middle">Signs the payload, resends it in PAYMENT-SIGNATURE</text>
  <circle cx="150" cy="376" r="13" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
  <text x="150" y="380" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="724" y="380" fill="#e11d48" font-size="10" font-weight="600">CLIENT</text>
  <line x1="440.0" y1="411" x2="440.0" y2="447" stroke="#e11d48" stroke-width="1.5" marker-end="url(#ah-rose)"/>
  <text x="560" y="433.0" fill="#64748b" font-size="10">/verify</text>
  <rect x="170" y="451" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="451" width="540" height="55" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440.0" y="476" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Server validates payment</text>
  <text x="440.0" y="495" fill="#64748b" font-size="10" text-anchor="middle">Facilitator /verify — signature and payload integrity</text>
  <circle cx="150" cy="471" r="13" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="475" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="724" y="475" fill="#d97706" font-size="10" font-weight="600">FACILITATOR</text>
  <line x1="440.0" y1="506" x2="440.0" y2="542" stroke="#d97706" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <text x="560" y="528.0" fill="#64748b" font-size="10">/settle</text>
  <rect x="170" y="546" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="546" width="540" height="55" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440.0" y="571" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Server executes settlement</text>
  <text x="440.0" y="590" fill="#64748b" font-size="10" text-anchor="middle">Facilitator /settle — transaction submitted on chain</text>
  <circle cx="150" cy="566" r="13" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="570" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <text x="724" y="570" fill="#d97706" font-size="10" font-weight="600">FACILITATOR</text>
  <line x1="440.0" y1="601" x2="440.0" y2="637" stroke="#d97706" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <rect x="170" y="641" width="540" height="55" rx="8" fill="#ffffff"/>
  <rect x="170" y="641" width="540" height="55" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440.0" y="666" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Server delivers the resource</text>
  <text x="440.0" y="685" fill="#64748b" font-size="10" text-anchor="middle">Response carries the tx hash in PAYMENT-RESPONSE</text>
  <circle cx="150" cy="661" r="13" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="665" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">6</text>
  <text x="724" y="665" fill="#7c3aed" font-size="10" font-weight="600">SERVER</text>
  <line x1="440.0" y1="696" x2="440.0" y2="732" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ah-violet)"/>
  <rect x="351.0" y="736" width="178" height="38" rx="19.0" fill="#ffffff"/>
  <rect x="351.0" y="736" width="178" height="38" rx="19.0" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="440.0" y="759.0" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Resource delivered</text>
  <rect x="48" y="808" width="18" height="11" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="74" y="818" fill="#64748b" font-size="10">User / manual step</text>
  <rect x="298" y="808" width="18" height="11" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="324" y="818" fill="#64748b" font-size="10">AI / automated step</text>
  <rect x="548" y="808" width="18" height="11" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="574" y="818" fill="#64748b" font-size="10">Network / external API</text>
  <rect x="48" y="828" width="18" height="11" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="74" y="838" fill="#64748b" font-size="10">Local signing (private key)</text>
  <rect x="298" y="828" width="18" height="11" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/>
  <text x="324" y="838" fill="#64748b" font-size="10">Start / end</text>
</svg>
