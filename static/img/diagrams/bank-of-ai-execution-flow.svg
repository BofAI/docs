  <text x="440.0" y="400" fill="#94a3b8" font-size="10" text-anchor="middle">Signed locally — the private key never leaves your machine</text>
  <circle cx="150" cy="376" r="13" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="150" y="380" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="724" y="380" fill="#fb7185" font-size="10" font-weight="600">WALLET</text>
  <line x1="440.0" y1="411" x2="440.0" y2="447" stroke="#fb7185" stroke-width="1.5" marker-end="url(#ah-rose)"/>
  <rect x="170" y="451" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="451" width="540" height="55" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="440.0" y="476" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Transaction broadcast</text>
  <text x="440.0" y="495" fill="#94a3b8" font-size="10" text-anchor="middle">Signed transaction submitted to a network node</text>
  <circle cx="150" cy="471" r="13" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="150" y="475" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="724" y="475" fill="#fbbf24" font-size="10" font-weight="600">RPC</text>
  <line x1="440.0" y1="506" x2="440.0" y2="542" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <rect x="170" y="546" width="540" height="55" rx="8" fill="#0f172a"/>
  <rect x="170" y="546" width="540" height="55" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="440.0" y="571" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Blockchain</text>
  <text x="440.0" y="590" fill="#94a3b8" font-size="10" text-anchor="middle">Executed and confirmed on chain</text>
  <circle cx="150" cy="566" r="13" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="150" y="570" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <text x="724" y="570" fill="#fbbf24" font-size="10" font-weight="600">CHAIN</text>
  <line x1="440.0" y1="601" x2="440.0" y2="637" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <rect x="337.0" y="641" width="206" height="38" rx="19.0" fill="#0f172a"/>
  <rect x="337.0" y="641" width="206" height="38" rx="19.0" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
  <text x="440.0" y="664.0" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Result returned to you</text>
  <rect x="48" y="713" width="18" height="11" rx="3" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="74" y="723" fill="#94a3b8" font-size="10">AI / automated step</text>
  <rect x="298" y="713" width="18" height="11" rx="3" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="324" y="723" fill="#94a3b8" font-size="10">Network / external API</text>
  <rect x="548" y="713" width="18" height="11" rx="3" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="574" y="723" fill="#94a3b8" font-size="10">Local signing (private key)</text>
  <rect x="48" y="733" width="18" height="11" rx="3" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="74" y="743" fill="#94a3b8" font-size="10">Start / end</text>
