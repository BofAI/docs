  <circle cx="150" cy="186" r="13" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="190" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="724" y="190" fill="#a78bfa" font-size="10" font-weight="600">LLM</text>
  <line x1="440.0" y1="221" x2="440.0" y2="257" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-violet)"/>
